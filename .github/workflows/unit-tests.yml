# Fast unit-test feedback on every push and pull request, without the
# C++/Python coverage instrumentation (see testing-and-coverage.yml, which
# is reserved for pull requests against main/rc1.0.0).

name: Unit tests

on:
  push:
  pull_request:

jobs:
  build:
    # Skip the pull_request run when the branch lives in this repo: the push
    # event already tested the same commit. PRs from forks still run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: Python ${{ matrix.python-version }} (OMP_NUM_THREADS=${{ matrix.omp-threads }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        omp-threads: ['nproc']
        include:
          # Extra single-threaded run on the newest Python
          - python-version: '3.14'
            omp-threads: '1'

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests with pytest
      run: |
        if [ "${{ matrix.omp-threads }}" = "nproc" ]; then
          export OMP_NUM_THREADS=$(nproc)
        else
          export OMP_NUM_THREADS=${{ matrix.omp-threads }}
        fi
        echo "OMP_NUM_THREADS=$OMP_NUM_THREADS"
        python -m pytest tests