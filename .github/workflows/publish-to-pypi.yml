# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://github.com/pypa/gh-action-pypi-publish#trusted-publishing

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels_linux:
    name: Build wheels on ${{ matrix.os }}-${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: [310, 311, 312, 313, 314]
        include:
          - python: 310
            python_version: "3.10"
          - python: 311
            python_version: "3.11"
          - python: 312
            python_version: "3.12"
          - python: 313
            python_version: "3.13"
          - python: 314
            python_version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBUILDWHEEL: 1
          CIBW_ENVIRONMENT_LINUX: PYTHON_VERSION_REQUIRED=${{ matrix.python_version }}
          CIBW_BUILD: cp${{ matrix.python }}-manylinux_x86_64
          CIBW_ARCHS: all
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_I686_IMAGE: manylinux2014
          CIBW_BUILD_VERBOSITY: 3
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_wheels_macos_x86:
    name: Build wheels on macos-15-intel-${{ matrix.python_version }}
    runs-on: macos-15-intel
    strategy:
      matrix:
        python: [310, 311, 312, 313, 314]
        include:
          - python: 310
            python_version: "3.10"
          - python: 311
            python_version: "3.11"
          - python: 312
            python_version: "3.12"
          - python: 313
            python_version: "3.13"
          - python: 314
            python_version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBUILDWHEEL: 1
          CIBW_BEFORE_ALL_MACOS: brew install llvm libomp
          CIBW_ENVIRONMENT_MACOS: PYTHON_VERSION_REQUIRED=${{ matrix.python_version }} MACOSX_DEPLOYMENT_TARGET="14.0" PATH="$(brew --prefix llvm)/bin:$PATH" CFLAGS="-I /usr/local/include -I/usr/local/opt/llvm/include" CXXFLAGS="-I /usr/local/include -I/usr/local/opt/llvm/include -I/opt/homebrew/opt/libomp/include -I/opt/homebrew/opt/llvm/include -I/usr/local/opt/libomp/include" LDFLAGS="-L/usr/local/opt/libomp/lib -L/opt/homebrew/opt/libomp/lib -L /usr/local/lib -L/usr/local/opt/llvm/lib"
          CIBW_BUILD: cp${{ matrix.python }}-macosx_x86_64
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 3
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-macos-intel-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_wheels_macos_arm64:
    name: Build wheels on macos-14-${{ matrix.python_version }}
    runs-on: macos-14
    strategy:
      matrix:
        python: [310, 311, 312, 313, 314]
        include:
          - python: 310
            python_version: "3.10"
          - python: 311
            python_version: "3.11"
          - python: 312
            python_version: "3.12"
          - python: 313
            python_version: "3.13"
          - python: 314
            python_version: "3.14"
    steps:
      - name: Checkout LePhare
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBUILDWHEEL: 1
          CIBW_BEFORE_ALL_MACOS: brew install llvm libomp
          CIBW_ENVIRONMENT_MACOS: PYTHON_VERSION_REQUIRED=${{ matrix.python_version }} MACOSX_DEPLOYMENT_TARGET="14.0" PATH="$(brew --prefix llvm)/bin:$PATH" CFLAGS="-I /usr/local/include -I/usr/local/opt/llvm/include" CXXFLAGS="-I /usr/local/include -I/usr/local/opt/llvm/include -I/opt/homebrew/opt/libomp/include -I/opt/homebrew/opt/llvm/include -I/usr/local/opt/libomp/include" LDFLAGS="-L/usr/local/opt/libomp/lib -L/opt/homebrew/opt/libomp/lib -L /usr/local/lib -L/usr/local/opt/llvm/lib"
          CIBW_BUILD: cp${{ matrix.python }}-macosx_arm64
          CIBW_ARCHS: all
          CIBW_BUILD_VERBOSITY: 3

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-macos-arm64-${{ matrix.python }}
          path: wheelhouse/*.whl


  build_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: recursive  # Optional, use if you have submodules

    - name: Build SDist
      run: pipx run build --sdist

    - name: Upload SDist
      uses: actions/upload-artifact@v7
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  upload_pypi:
    name: Upload to pypi
    needs: [build_wheels_linux, build_wheels_macos_x86, build_wheels_macos_arm64, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
