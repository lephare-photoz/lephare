# This workflow will install Python dependencies, run tests and report code coverage with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
#
# Coverage instrumentation (C++ via gcov/lcov, Python via coverage.py) is
# noticeably slower than a plain test run, so it is reserved for pull
# requests against main/rc1.0.0 rather than every push. See
# unit-tests.yml for the fast push/PR test-only workflow.

name: Unit test and code coverage

on:
  pull_request:
    branches: [ main, rc1.0.0 ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      INCLUDE_COVERAGE: TRUE
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yy lcov
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests with pytest
      run: |
        $PWD/scripts/run_coverage.sh ci

    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.txt
        token: ${{ secrets.CODECOV_TOKEN }}
